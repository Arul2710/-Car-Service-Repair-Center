<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Car Service &amp; Repair Center</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563EB'/><text x='50' y='62' font-size='48' text-anchor='middle' fill='white'>🚗</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        secondary: '#111827',
                        accent: '#F97316',
                        background: '#F8FAFC',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-12px) rotate(-2deg); }
            50% { transform: translateY(-6px) rotate(0deg); }
            75% { transform: translateY(-14px) rotate(2deg); }
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .float-anim { animation: float 4s ease-in-out infinite; }
        .bounce-slow { animation: bounce-slow 2s ease-in-out infinite; }
        .sparkle-1 { animation: sparkle 2s ease-in-out infinite 0s; }
        .sparkle-2 { animation: sparkle 2s ease-in-out infinite 0.5s; }
        .sparkle-3 { animation: sparkle 2s ease-in-out infinite 1s; }
    </style>
</head>
<body class="font-inter bg-background text-secondary dark:bg-[#0F172A] dark:text-gray-200">

    <!-- Dark Mode Toggle -->
    <button id="darkModeToggle" class="dark-mode-toggle-btn" aria-label="Toggle dark mode">
        <svg class="sun-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg class="moon-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </button>

    <!-- Navbar Placeholder -->
    <div id="navbar-container"></div>

    <!-- 404 Content -->
    <section class="min-h-[80vh] flex items-center justify-center px-4 py-16">
        <div class="max-w-3xl mx-auto text-center">
            <!-- Animated SVG Illustration -->
            <div class="mb-8">
                <svg class="float-anim w-64 h-48 mx-auto" viewBox="0 0 400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Road -->
                    <path d="M0 220 Q200 200 400 220" stroke="#E5E7EB" stroke-width="3" fill="none"/>
                    <line x1="20" y1="222" x2="80" y2="222" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="8 6"/>
                    <line x1="100" y1="219" x2="160" y2="219" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="8 6"/>
                    <line x1="240" y1="219" x2="300" y2="219" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="8 6"/>
                    <line x1="320" y1="222" x2="380" y2="222" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="8 6"/>

                    <!-- Car Body -->
                    <g transform="translate(110, 140)">
                        <!-- Car shadow -->
                        <ellipse cx="90" cy="88" rx="80" ry="8" fill="#E5E7EB" opacity="0.5"/>
                        <!-- Car body -->
                        <rect x="10" y="30" width="160" height="50" rx="12" fill="#2563EB"/>
                        <!-- Car roof -->
                        <path d="M40 30 L60 5 L140 5 L155 30" fill="#1D4ED8"/>
                        <!-- Windows -->
                        <path d="M62 7 L42 28 L75 28 L75 7 Z" fill="#BFDBFE" opacity="0.9"/>
                        <path d="M78 7 L78 28 L138 28 L125 7 Z" fill="#BFDBFE" opacity="0.9"/>
                        <!-- Headlight -->
                        <rect x="162" y="42" width="12" height="8" rx="2" fill="#FCD34D"/>
                        <!-- Tail light -->
                        <rect x="8" y="42" width="10" height="8" rx="2" fill="#EF4444"/>
                        <!-- Front wheel -->
                        <circle cx="45" cy="80" r="18" fill="#1F2937"/>
                        <circle cx="45" cy="80" r="11" fill="#4B5563"/>
                        <circle cx="45" cy="80" r="5" fill="#9CA3AF"/>
                        <!-- Rear wheel -->
                        <circle cx="135" cy="80" r="18" fill="#1F2937"/>
                        <circle cx="135" cy="80" r="11" fill="#4B5563"/>
                        <circle cx="135" cy="80" r="5" fill="#9CA3AF"/>
                        <!-- Door line -->
                        <line x1="90" y1="30" x2="90" y2="78" stroke="#1D4ED8" stroke-width="1.5"/>
                        <!-- Door handle -->
                        <rect x="70" y="48" width="12" height="4" rx="2" fill="#60A5FA"/>
                    </g>

                    <!-- Wrench -->
                    <g transform="translate(280, 100) rotate(30)">
                        <rect x="-3" y="0" width="6" height="55" rx="3" fill="#F97316"/>
                        <ellipse cx="0" cy="0" rx="14" ry="12" fill="none" stroke="#F97316" stroke-width="5"/>
                        <ellipse cx="0" cy="0" rx="8" ry="6" fill="#F8FAFC"/>
                        <rect x="-4" y="52" width="8" height="4" rx="1" fill="#EA580C"/>
                    </g>

                    <!-- Question marks -->
                    <g class="bounce-slow">
                        <text x="60" y="130" font-size="40" font-weight="bold" fill="#2563EB" opacity="0.15">?</text>
                        <text x="320" y="80" font-size="30" font-weight="bold" fill="#F97316" opacity="0.15">?</text>
                        <text x="180" y="100" font-size="24" font-weight="bold" fill="#2563EB" opacity="0.1">?</text>
                    </g>

                    <!-- Sparkles -->
                    <circle cx="50" cy="80" r="3" fill="#F97316" class="sparkle-1"/>
                    <circle cx="350" cy="120" r="2.5" fill="#2563EB" class="sparkle-2"/>
                    <circle cx="200" cy="60" r="2" fill="#F97316" class="sparkle-3"/>
                    <circle cx="300" cy="160" r="3" fill="#2563EB" class="sparkle-1"/>
                    <circle cx="80" cy="170" r="2" fill="#F97316" class="sparkle-2"/>
                </svg>
            </div>

            <!-- 404 Number -->
            <h1 class="text-[10rem] sm:text-[12rem] font-black leading-none bg-gradient-to-r from-primary via-blue-500 to-accent bg-clip-text text-transparent select-none">404</h1>

            <!-- Heading -->
            <h2 class="text-3xl sm:text-4xl font-bold text-secondary dark:text-white mt-4 mb-4">Oops! Page Not Found</h2>
            <p class="text-gray-500 dark:text-gray-400 text-lg max-w-xl mx-auto mb-10 leading-relaxed">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

            <!-- Search Bar -->
            <div class="max-w-lg mx-auto mb-10">
                <form class="relative" onsubmit="event.preventDefault(); window.location.href='index.html?q=' + encodeURIComponent(this.querySelector('input').value);">
                    <input type="text" placeholder="Search for services, repairs, or information..." class="w-full px-6 py-4 pr-14 rounded-2xl border border-gray-200 dark:border-gray-700 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all duration-200 text-sm bg-white dark:bg-gray-800 dark:text-white shadow-sm">
                    <button type="submit" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-primary hover:bg-blue-700 text-white rounded-xl flex items-center justify-center transition-colors duration-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Quick Links -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-8">
                <a href="index.html" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-primary hover:bg-blue-700 text-white font-semibold px-8 py-3.5 rounded-xl transition-all duration-200 hover:shadow-lg hover:shadow-primary/25">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Go to Homepage
                </a>
                <a href="services.html" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:border-primary/30 text-secondary dark:text-gray-300 font-semibold px-8 py-3.5 rounded-xl transition-all duration-200 hover:shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    Browse Services
                </a>
                <a href="contact.html" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:border-accent/30 text-secondary dark:text-gray-300 font-semibold px-8 py-3.5 rounded-xl transition-all duration-200 hover:shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    Contact Us
                </a>
            </div>

            <!-- Phone Number -->
            <div class="flex items-center justify-center gap-2 text-gray-400 dark:text-gray-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                </svg>
                <span class="text-sm">Or call us at <a href="tel:+18001234567" class="text-primary font-semibold hover:underline">+1 (800) 123-4567</a></span>
            </div>
        </div>
    </section>

    <!-- Footer Placeholder -->
    <div id="footer-container"></div>

    <!-- Scroll to Top -->
    <button id="scrollTopBtn" class="fixed bottom-24 right-6 z-50 w-12 h-12 bg-primary hover:bg-blue-700 text-white rounded-full shadow-lg hover:shadow-xl transition-all duration-300 opacity-0 invisible flex items-center justify-center" aria-label="Scroll to top">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
        </svg>
    </button>

    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Dark Mode
        (function() {
            var saved = localStorage.getItem('darkMode');
            if (saved === 'true' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            var btn = document.getElementById('darkModeToggle');
            if (btn) {
                btn.addEventListener('click', function() {
                    var isDark = document.documentElement.classList.toggle('dark');
                    localStorage.setItem('darkMode', isDark);
                });
            }
        })();
    </script>
</body>
</html>
